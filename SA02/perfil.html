<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil | NovaWeb</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <header class="cabecalho-sistema">

        <h1>NovaWeb</h1>

        <nav>
            <a href="login.html">Login</a>
            <a href="perfil.html">Meu Perfil</a>
            <a href="consulta.html">Consultas</a>
        </nav>

    </header>

    <main class="pagina-conteudo">

        <h2 class="titulo-pagina">Meu Perfil</h2>

        <section class="container-perfil">

            <img
                src="assets/images/avatar-usuario.png"
                alt="Avatar ilustrativo de usuário"
                class="imagem-avatar"
            >

            <h3>Informações pessoais</h3>

            <p>
                Preencha os campos abaixo para cadastrar seu perfil.
            </p>

            <form id="form-perfil">

                <div class="campo-formulario">
                    <label for="nome">Nome completo</label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="email-perfil">E-mail</label>

                    <input
                        type="email"
                        id="email-perfil"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="cpf">CPF</label>

                    <input
                        type="text"
                        id="cpf"
                        placeholder="Digite seu CPF"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="nascimento">Data de nascimento</label>

                    <input
                        type="date"
                        id="nascimento"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="tipo-usuario">Tipo de usuário</label>

                    <select id="tipo-usuario" required>
                        <option value="">Selecione uma opção</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Funcionário">Funcionário</option>
                        <option value="Cliente">Cliente</option>
                    </select>
                </div>

                <div class="campo-formulario">

                    <label>Áreas de interesse</label>

                    <div class="grupo-checkbox">

                        <label>
                            <input
                                type="checkbox"
                                name="interesses"
                                value="Roupas"
                            >
                            Roupas
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="interesses"
                                value="Calçados"
                            >
                            Calçados
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="interesses"
                                value="Acessórios"
                            >
                            Acessórios
                        </label>

                    </div>

                </div>

                <div class="campo-formulario">
                    <label for="estado">Estado</label>

                    <select id="estado" required>
                        <option value="">Selecione seu estado</option>
                        <option value="SP">São Paulo</option>
                        <option value="PR">Paraná</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="RS">Rio Grande do Sul</option>
                    </select>
                </div>

                <div class="campo-formulario">
                    <label for="descricao">Sobre você</label>

                    <textarea
                        id="descricao"
                        rows="4"
                        placeholder="Conte um pouco sobre você..."
                    ></textarea>
                </div>

                <button type="submit" class="botao-login">
                    Cadastrar perfil
                </button>

            </form>

        </section>

    </main>

    <script src="js/script.js"></script>

</body>
</html>
