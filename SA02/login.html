<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | NovaWeb</title>

    <!-- Arquivo de estilização CSS -->
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <main class="pagina-login">

        <section class="container-login">

            <header class="cabecalho-login">
                <h1>NovaWeb</h1>
                <p>Bem-vindo(a) de volta!</p>
                <span>Acesse sua conta para continuar.</span>
            </header>

            <form id="form-login">

                <div class="campo-formulario">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <div class="opcoes-login">
                    <label>
                        <input type="checkbox" name="lembrar">
                        Lembrar de mim
                    </label>

                    <a href="#" class="link-senha">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="botao-login">
                    Entrar
                </button>

            </form>

            <footer class="rodape-login">
                <p>NovaWeb - Sistema Administrativo</p>
            </footer>

        </section>

    </main>

    <!-- Arquivo JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
