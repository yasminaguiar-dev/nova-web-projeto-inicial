<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NovaWeb</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body class="pagina-login">

    <main class="container-login">

        <header class="cabecalho-login">
            <h1>NovaWeb</h1>
            <p>Bem-vindo ao nosso sistema administrativo</p>
        </header>

        <img
            src="assets/images/login-ilustration.png"
            alt="Ilustração da tela de login"
            class="imagem-login"
        >

        <form id="form-login">

            <div class="campo-formulario">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >
            </div>

            <div class="campo-formulario">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >
            </div>

            <div class="opcoes-login">

                <label>
                    <input type="checkbox" id="lembrar">
                    Lembrar de mim
                </label>

                <a href="#">Esqueceu a senha?</a>

            </div>

            <button type="submit" class="botao-login">
                Entrar
            </button>

        </form>

        <footer class="rodape-login">
            <p>NovaWeb - Sistema Administrativo</p>
        </footer>

    </main>

    <script src="js/script.js"></script>

</body>
</html>
