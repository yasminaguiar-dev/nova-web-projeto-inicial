<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 15 - Formulários</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="script.js" defer></script>
</head>
<body>

    <!--
    Descricao: Formulario de cadastro com JavaScript.
    nome_arquivo: index.html
    nome_exercicio: Aula 15 - JavaScript aplicado a Formularios
    nome_aluno: Yasmin Ferreira Aguiar
    email_aluno: yasmin.aguiar@portalsesisp.org.br
    turma: TDE-1BAA-26
    -->

    <main class="container">
        <h1>Formulário de Cadastro</h1>

        <div id="mensagem" role="status" hidden></div>

        <form id="formulario" onsubmit="return cadastrar(event)">

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome"
                   placeholder="Digite seu nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email"
                   placeholder="Digite seu e-mail" required>

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade"
                   placeholder="Digite sua cidade" required>

            <button type="submit">Cadastrar</button>

        </form>
    </main>

</body>
</html>
